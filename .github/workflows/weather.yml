name: weather
# Каждые 30 минут: ветер на станциях российского берега; сетки прогноза всех моделей — когда старше 2,5 ч.
# Результат — в ветке data (не трогает сайт): https://raw.githubusercontent.com/Sandovich/kurs/data/obs.json
on:
  schedule: [{cron: '7,37 * * * *'}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: weather, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: collect
        run: |
          ARG=""; if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARG=grid; fi
          python3 tools/wx_collect.py $ARG
      - name: publish to data branch
        run: |
          mkdir pub && cd pub
          git init -q -b data
          git config user.name "kurs-weather"; git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # старые файлы (сетки прогноза) сохраняем, новые кладём поверх; в ветке всегда один коммит
          if git fetch -q --depth=1 origin data; then git checkout -q FETCH_HEAD -- . ; fi
          cp -f ../out/* .
          git add -A; git commit -q -m "weather $(date -u +%FT%H:%M)"
          git push -q -f origin data
